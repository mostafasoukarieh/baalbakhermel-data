<!-- سكربت صفحة الطقس: يوضع مرة واحدة في أداة HTML/JavaScript في التخطيط -->
<script>
//<![CDATA[
(function () {
  // يعمل فقط في الصفحة التي فيها العنصر #bh-weather، حتى لو حمّل القالب محتوى التدوينة لاحقاً
  function boot() {
    if (window.__bhWeather || !document.getElementById("bh-weather")) return false;
    window.__bhWeather = true;
    init();
    return true;
  }
  function init() {
  // ===== الإعدادات =====
  var REFRESH_MINUTES = 30;
  var TOWNS = [
    { name: "بعلبك",       lat: 34.006, lon: 36.218 },
    { name: "الهرمل",      lat: 34.394, lon: 36.385 },
    { name: "دير الأحمر",  lat: 34.125, lon: 36.130 },
    { name: "شمسطار",      lat: 33.963, lon: 36.060 },
    { name: "بريتال",      lat: 33.945, lon: 36.247 },
    { name: "اللبوة",      lat: 34.196, lon: 36.350 },
    { name: "عرسال",       lat: 34.179, lon: 36.420 },
    { name: "الفاكهة",     lat: 34.233, lon: 36.404 },
    { name: "القاع",       lat: 34.343, lon: 36.476 }
  ];

  // رموز الطقس العالمية (WMO) بالعربية
  var WMO = {
    0: ["صحو", "☀️", "🌙"], 1: ["صحو غالباً", "🌤️", "🌙"], 2: ["غائم جزئياً", "⛅", "☁️"],
    3: ["غائم", "☁️", "☁️"], 45: ["ضباب", "🌫️", "🌫️"], 48: ["ضباب مع صقيع", "🌫️", "🌫️"],
    51: ["رذاذ خفيف", "🌦️", "🌧️"], 53: ["رذاذ", "🌦️", "🌧️"], 55: ["رذاذ كثيف", "🌧️", "🌧️"],
    56: ["رذاذ متجمّد", "🌧️", "🌧️"], 57: ["رذاذ متجمّد كثيف", "🌧️", "🌧️"],
    61: ["أمطار خفيفة", "🌦️", "🌧️"], 63: ["أمطار", "🌧️", "🌧️"], 65: ["أمطار غزيرة", "🌧️", "🌧️"],
    66: ["أمطار متجمّدة", "🌧️", "🌧️"], 67: ["أمطار متجمّدة غزيرة", "🌧️", "🌧️"],
    71: ["ثلوج خفيفة", "🌨️", "🌨️"], 73: ["ثلوج", "❄️", "❄️"], 75: ["ثلوج كثيفة", "❄️", "❄️"],
    77: ["حبيبات ثلج", "🌨️", "🌨️"], 80: ["زخات مطر خفيفة", "🌦️", "🌧️"], 81: ["زخات مطر", "🌧️", "🌧️"],
    82: ["زخات مطر غزيرة", "⛈️", "⛈️"], 85: ["زخات ثلج", "🌨️", "🌨️"], 86: ["زخات ثلج كثيفة", "❄️", "❄️"],
    95: ["عواصف رعدية", "⛈️", "⛈️"], 96: ["عواصف رعدية مع برَد", "⛈️", "⛈️"], 99: ["عواصف رعدية مع برَد كثيف", "⛈️", "⛈️"]
  };
  function wmo(code, isDay) {
    var w = WMO[code] || ["—", "🌡️", "🌡️"];
    return { text: w[0], icon: isDay === 0 ? w[2] : w[1] };
  }

  var LOCALE = "ar-LB-u-nu-latn";
  var TZ = "Asia/Beirut";
  var data = null, selected = 0, timer = null;
  var $ = function (id) { return document.getElementById(id); };
  var r = function (x) { return Math.round(x); };

  function dayName(dateStr, i) {
    if (i === 0) return "اليوم";
    if (i === 1) return "غداً";
    return new Date(dateStr + "T12:00:00").toLocaleDateString(LOCALE, { weekday: "long", timeZone: TZ });
  }
  function shortDate(dateStr) {
    return new Date(dateStr + "T12:00:00").toLocaleDateString(LOCALE, { day: "numeric", month: "long", timeZone: TZ });
  }
  function hhmm(iso) { return iso ? iso.slice(11, 16) : ""; }

  function buildUrl() {
    return "https://api.open-meteo.com/v1/forecast" +
      "?latitude=" + TOWNS.map(function (t) { return t.lat; }).join(",") +
      "&longitude=" + TOWNS.map(function (t) { return t.lon; }).join(",") +
      "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,snowfall_sum,wind_gusts_10m_max,sunrise,sunset" +
      "&timezone=" + encodeURIComponent(TZ) + "&forecast_days=7";
  }

  // ===== النشرة المكتوبة تلقائياً =====
  function buildBulletin(all) {
    var b = all[0], h = all[1], d = b.daily, today = wmo(d.weather_code[0], 1).text;
    var dateTxt = new Date().toLocaleDateString(LOCALE, { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: TZ });
    var p = [];
    p.push("<p><b>" + dateTxt + ":</b> الطقس اليوم في بعلبك <b>" + today + "</b>، والحرارة بين " +
      r(d.temperature_2m_min[0]) + " و" + r(d.temperature_2m_max[0]) + " درجة مئوية. " +
      "وفي الهرمل " + wmo(h.daily.weather_code[0], 1).text + "، والحرارة بين " +
      r(h.daily.temperature_2m_min[0]) + " و" + r(h.daily.temperature_2m_max[0]) + " درجة.</p>");

    var cur = b.current;
    p.push("<p>الحرارة الآن في بعلبك " + r(cur.temperature_2m) + " درجة (الإحساس الفعلي " +
      r(cur.apparent_temperature) + ")، والرطوبة " + cur.relative_humidity_2m + "%، والرياح " +
      r(cur.wind_speed_10m) + " كم/س. شروق الشمس " + hhmm(d.sunrise[0]) + " وغروبها " + hhmm(d.sunset[0]) + ".</p>");

    // الغد وبعده
    var tmw = "غداً " + wmo(d.weather_code[1], 1).text + " والحرارة بين " + r(d.temperature_2m_min[1]) + " و" + r(d.temperature_2m_max[1]) + " درجة";
    var diff = d.temperature_2m_max[1] - d.temperature_2m_max[0];
    if (diff <= -3) tmw += "، مع انخفاض ملحوظ في درجات الحرارة";
    else if (diff >= 3) tmw += "، مع ارتفاع ملحوظ في درجات الحرارة";
    p.push("<p>" + tmw + ".</p>");

    // أيام المطر هذا الأسبوع في بعلبك
    var rainy = [];
    for (var i = 0; i < d.time.length; i++) {
      if (d.precipitation_sum[i] >= 1 || d.precipitation_probability_max[i] >= 60) rainy.push(dayName(d.time[i], i));
    }
    p.push("<p>" + (rainy.length
      ? "يُتوقَّع هطول أمطار هذا الأسبوع: " + rainy.join("، ") + "."
      : "لا يُتوقَّع هطول أمطار مؤثرة خلال الأيام السبعة القادمة.") + "</p>");
    return p.join("");
  }

  // ===== التنبيهات (الأيام الثلاثة القادمة، كل البلدات) =====
  function buildAlerts(all) {
    var groups = {};
    function add(key, label, town, day) {
      if (!groups[key]) groups[key] = { label: label, towns: {}, days: {} };
      groups[key].towns[town] = 1; groups[key].days[day] = 1;
    }
    all.forEach(function (loc, ti) {
      var d = loc.daily, town = TOWNS[ti].name;
      for (var i = 0; i < 3; i++) {
        var day = dayName(d.time[i], i), c = d.weather_code[i];
        if (d.snowfall_sum[i] > 0 || (c >= 71 && c <= 86 && c !== 80 && c !== 81 && c !== 82)) add("snow", "❄️ تساقط ثلوج", town, day);
        if (d.temperature_2m_min[i] <= 0) add("frost", "🥶 صقيع وجليد (حرارة دون الصفر) — الحذر على الطرقات وحماية المزروعات", town, day);
        if (d.precipitation_sum[i] >= 15) add("rain", "🌧️ أمطار غزيرة — احتمال تجمّع مياه وسيول", town, day);
        if (d.wind_gusts_10m_max[i] >= 60) add("wind", "💨 رياح قوية (هبّات تفوق 60 كم/س)", town, day);
        if (c >= 95) add("storm", "⛈️ عواصف رعدية", town, day);
        if (d.temperature_2m_max[i] >= 35) add("heat", "🔥 موجة حرّ — تجنّبوا التعرّض للشمس وقت الظهيرة", town, day);
        if (c === 45 || c === 48) add("fog", "🌫️ ضباب — انتبهوا لانخفاض الرؤية أثناء القيادة", town, day);
      }
    });
    var keys = Object.keys(groups);
    if (!keys.length) return '<li class="bhw-ok">✅ لا تنبيهات جوية للأيام الثلاثة القادمة.</li>';
    return keys.map(function (k) {
      var g = groups[k];
      return "<li><b>" + g.label + "</b><br><small>الأيام: " + Object.keys(g.days).join("، ") +
        " — البلدات: " + Object.keys(g.towns).join("، ") + "</small></li>";
    }).join("");
  }

  // ===== العرض =====
  function renderTowns(all) {
    $("bhw-towns").innerHTML = all.map(function (loc, i) {
      var c = loc.current, w = wmo(c.weather_code, c.is_day), d = loc.daily;
      return '<div class="bhw-card' + (i === selected ? " bhw-sel" : "") + '" data-i="' + i + '">' +
        '<div class="bhw-name">' + TOWNS[i].name + "</div>" +
        '<div class="bhw-ico">' + w.icon + "</div>" +
        '<div class="bhw-temp">' + r(c.temperature_2m) + "°</div>" +
        '<div class="bhw-desc">' + w.text + "</div>" +
        '<div class="bhw-small">العظمى ' + r(d.temperature_2m_max[0]) + "° · الصغرى " + r(d.temperature_2m_min[0]) + "°</div>" +
        '<div class="bhw-small">💧 ' + c.relative_humidity_2m + "% · 💨 " + r(c.wind_speed_10m) + " كم/س</div>" +
        "</div>";
    }).join("");
    Array.prototype.forEach.call(document.querySelectorAll("#bhw-towns .bhw-card"), function (el) {
      el.onclick = function () { selected = +el.getAttribute("data-i"); renderTowns(data); renderForecast(data); };
    });
  }

  function renderForecast(all) {
    var d = all[selected].daily;
    $("bhw-fc-title").textContent = "📅 توقعات الأسبوع في " + TOWNS[selected].name;
    $("bhw-forecast").innerHTML = d.time.map(function (t, i) {
      var w = wmo(d.weather_code[i], 1);
      var rain = d.precipitation_probability_max[i];
      return '<div class="bhw-day">' +
        '<div class="bhw-dn">' + dayName(t, i) + "</div>" +
        '<div class="bhw-dd">' + shortDate(t) + "</div>" +
        '<div class="bhw-ico">' + w.icon + "</div>" +
        "<div>" + w.text + "</div>" +
        '<div class="bhw-mm">' + r(d.temperature_2m_max[i]) + '° / <span class="bhw-min">' + r(d.temperature_2m_min[i]) + "°</span></div>" +
        '<div class="bhw-small">☔ ' + (rain == null ? 0 : rain) + "%" +
        (d.precipitation_sum[i] > 0 ? " · " + d.precipitation_sum[i].toFixed(1) + " ملم" : "") + "</div>" +
        "</div>";
    }).join("");
  }

  function render(all) {
    data = all;
    $("bhw-news").innerHTML = buildBulletin(all);
    $("bhw-alerts").innerHTML = buildAlerts(all);
    renderTowns(all);
    renderForecast(all);
    $("bhw-updated").textContent = "آخر تحديث: " +
      new Date().toLocaleTimeString(LOCALE, { hour: "2-digit", minute: "2-digit", timeZone: TZ });
  }

  var lastLoad = 0;
  // نسخة احتياطية يحدّثها GitHub كل ساعة، تُستعمل إذا تعذّر الاتصال المباشر بمصدر الطقس
  var BACKUP_URL = "https://raw.githubusercontent.com/mostafasoukarieh/baalbakhermel-data/main/weather.json";
  function getJson(url, ms) {
    var ctl = window.AbortController ? new AbortController() : null;
    var t = ctl && setTimeout(function () { ctl.abort(); }, ms || 12000);
    return fetch(url, ctl ? { signal: ctl.signal, cache: "no-store" } : {}).then(function (res) {
      if (t) clearTimeout(t);
      if (!res.ok) throw new Error(res.status);
      return res.json();
    });
  }
  function load() {
    lastLoad = Date.now();
    $("bhw-updated").textContent = "جارٍ التحديث…";
    getJson(buildUrl(), 12000)
      .catch(function () { return getJson(buildUrl(), 15000); })   // محاولة ثانية
      .then(function (json) { render(Array.isArray(json) ? json : [json]); })
      .catch(function () {
        return getJson(BACKUP_URL + "?t=" + Date.now(), 15000).then(function (b) {
          render(b.data);
          var tm = new Date(b.updated).toLocaleTimeString(LOCALE, { hour: "2-digit", minute: "2-digit", timeZone: TZ });
          $("bhw-updated").textContent = "آخر تحديث: " + tm + " (نسخة احتياطية)";
        });
      })
      .catch(function () {
        $("bhw-updated").innerHTML = '<span class="bhw-err">تعذّر جلب البيانات، ستُعاد المحاولة بعد دقيقة.</span>';
        clearTimeout(timer); timer = setTimeout(load, 60000);
      });
  }

  $("bhw-refresh").onclick = load;
  load();
  setInterval(load, REFRESH_MINUTES * 60000);
  // تحديث فوري عند عودة الزائر إلى التبويب بعد غياب طويل
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && Date.now() - lastLoad > 10 * 60000) load();
  });
}
  if (!boot()) {
    var mo = new MutationObserver(function () { if (boot()) mo.disconnect(); });
    mo.observe(document.documentElement, { childList: true, subtree: true });
    setTimeout(function () { mo.disconnect(); }, 30000);
  }
})();
//]]>
</script>
<!-- سكربت صفحة المحروقات: يوضع مرة واحدة في أداة HTML/JavaScript في التخطيط -->
<script>
//<![CDATA[
(function () {
  // يعمل فقط في الصفحة التي فيها العنصر #bh-fuel، حتى لو حمّل القالب محتوى التدوينة لاحقاً
  function boot() {
    if (window.__bhFuel || !document.getElementById("bh-fuel")) return false;
    window.__bhFuel = true;
    init();
    return true;
  }
  function init() {
  // ===== عدّل اسم المستودع هنا إذا اخترت اسماً آخر =====
  var DATA_URL = "https://raw.githubusercontent.com/mostafasoukarieh/baalbakhermel-data/main/fuel.json";
  var REFRESH_MINUTES = 60;

  var LOCALE = "ar-LB-u-nu-latn";
  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (n) { return Number(n).toLocaleString("en-US"); };
  function dateAr(iso, withDay) {
    if (!iso) return "";
    var o = { day: "numeric", month: "long", year: "numeric", timeZone: "Asia/Beirut" };
    if (withDay) o.weekday = "long";
    return new Date(iso + "T12:00:00").toLocaleDateString(LOCALE, o);
  }
  function changeBadge(c) {
    if (c > 0) return '<span class="bhf-ch bhf-up">▲ ارتفع ' + fmt(c) + " ل.ل.</span>";
    if (c < 0) return '<span class="bhf-ch bhf-down">▼ انخفض ' + fmt(-c) + " ل.ل.</span>";
    return '<span class="bhf-ch bhf-same">● دون تغيير</span>';
  }
  function verb(c) {
    return c > 0 ? "ارتفع " + fmt(c) + " ليرة" : c < 0 ? "انخفض " + fmt(-c) + " ليرة" : "بقي دون تغيير";
  }

  function usd(n, rate) { return "$" + (n / rate).toFixed(2); }
  function e(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return "&#" + c.charCodeAt(0) + ";"; }); }

  function render(d) {
    var rate = d.usd_rate || 89700;
    $("bhf-date").textContent = "جدول " + dateAr(d.date, true) + (d.decision ? " — قرار رقم " + d.decision : "");

    // خبر جاهز للنشر
    var it = d.items, liquid = it.slice(0, 3), gas = it[3];
    var s = "<p>صدر عن وزارة الطاقة والمياه جدول أسعار المحروقات بتاريخ " + dateAr(d.date, true) + "، وجاءت الأسعار كالتالي:</p><p>";
    s += liquid.map(function (x) {
      return "• سعر صفيحة " + e(x.name) + ": <b>" + fmt(x.price) + "</b> ليرة (" + verb(x.change) + ")";
    }).join("<br>");
    s += "<br>• سعر " + e(gas.name) + ": <b>" + fmt(gas.price) + "</b> ليرة";
    if (gas.change && d.gas_date === d.date) s += " (" + verb(gas.change) + ")";
    s += "</p><p><small>السعر بالدولار على أساس " + fmt(rate) + " ليرة للدولار.</small></p>";
    $("bhf-news").innerHTML = s;

    $("bhf-cards").innerHTML = it.map(function (x, i) {
      var note = (i === 3 && d.gas_date !== d.date)
        ? '<div class="bhf-u">آخر تعديل: ' + dateAr(d.gas_date) + "</div>"
        : '<div class="bhf-u">مقارنة بجدول ' + dateAr(x.prev_date) + "</div>";
      return '<div class="bhf-card"><div class="bhf-n">' + e(x.name) + '</div>' +
        '<div class="bhf-p">' + fmt(x.price) + '</div><div class="bhf-u">' + e(x.unit) + "</div>" +
        '<div class="bhf-usd">≈ ' + usd(x.price, rate) + "</div>" +
        changeBadge(x.change) + note + "</div>";
    }).join("");

    var h = "<tr><th>التاريخ</th><th>بنزين 95</th><th>بنزين 98</th><th>المازوت</th><th>بنزين 95 بالدولار</th></tr>";
    h += (d.history || []).map(function (r) {
      return "<tr><td>" + dateAr(r.date) + '</td><td class="n">' + fmt(r.b95) + '</td><td class="n">' +
        fmt(r.b98) + '</td><td class="n">' + fmt(r.diesel) + '</td><td class="n">' + usd(r.b95, rate) + "</td></tr>";
    }).join("");
    $("bhf-hist").innerHTML = h;
  }

  function load() {
    // ?t= يمنع المتصفح من عرض نسخة قديمة محفوظة
    fetch(DATA_URL + "?t=" + Math.floor(Date.now() / 300000))
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(function () { $("bhf-date").innerHTML = '<span class="bhf-err">تعذّر تحميل الأسعار حالياً، أعد المحاولة لاحقاً.</span>'; });
  }
  load();
  setInterval(load, REFRESH_MINUTES * 60000);
}
  if (!boot()) {
    var mo = new MutationObserver(function () { if (boot()) mo.disconnect(); });
    mo.observe(document.documentElement, { childList: true, subtree: true });
    setTimeout(function () { mo.disconnect(); }, 30000);
  }
})();
//]]>
</script>
