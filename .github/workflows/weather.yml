name: نشرة الطقس اليومية

on:
  # المواعيد يشغّلها Google Apps Script (site/apps-script-scheduler.gs)
  workflow_dispatch:
    inputs:
      mode:
        description: "draft = مسودة للتجربة، publish = نشر فعلي، snapshot = تحديث weather.json لصفحة الطقس"
        default: draft
        type: choice
        options: [draft, publish, snapshot]
      source:
        description: "auto = Open-Meteo ثم الاحتياطي، met = تجربة المصدر الاحتياطي"
        default: auto
        type: choice
        options: [auto, met]

permissions:
  contents: write

concurrency: weather

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: نشر نشرة الطقس
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_MODE: ${{ github.event.inputs.mode || 'publish' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          WEATHER_SOURCE: ${{ github.event.inputs.source || 'auto' }}
          WEATHER_PAGE_URL: "https://www.baalbakhermel.com/p/weather-page.html"
        run: python scripts/weather.py
      - name: حفظ حالة النشر وبيانات الطقس
        run: |
          [ -z "$(git status --porcelain -- weather-posted.json weather.json)" ] && exit 0
          git config user.name "weather-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- weather-posted.json weather.json
          git commit -m "الطقس $(TZ=Asia/Beirut date '+%F %H:%M')"
          git pull --rebase -q && git push
