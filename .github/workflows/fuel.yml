name: تحديث أسعار المحروقات

on:
  schedule:
    # كل ساعتين من 7 صباحاً حتى 5 مساءً بتوقيت بيروت، كل يوم
    # (الجدول يصدر عادة الثلاثاء والجمعة، لكنه يصدر أحياناً في أيام أخرى)
    - cron: "13 5-15/2 * * *"
  workflow_dispatch: {}   # زر تشغيل يدوي للتجربة

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: جلب الأسعار
        run: python scripts/fuel.py
      - name: حفظ التغييرات
        run: |
          if git diff --quiet -- fuel.json 2>/dev/null && git ls-files --error-unmatch fuel.json >/dev/null 2>&1; then
            echo "لا تغيير"; exit 0
          fi
          git config user.name "fuel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add fuel.json
          git commit -m "أسعار المحروقات $(date -u +%F)"
          git push
