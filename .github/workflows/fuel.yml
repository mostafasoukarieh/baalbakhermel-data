name: تحديث أسعار المحروقات

on:
  schedule:
    # كل ساعتين من 7 صباحاً حتى 5 مساءً بتوقيت بيروت، كل يوم
    # (الجدول يصدر عادة الثلاثاء والجمعة، لكنه يصدر أحياناً في أيام أخرى)
    - cron: "13 5-15/2 * * *"
  workflow_dispatch:      # زر تشغيل يدوي
    inputs:
      update_post:
        description: "حدّث منشور آخر جدول بدل إنشاء منشور جديد"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: جلب الأسعار
        run: python scripts/fuel.py
      - name: نشر الخبر على بلوغر
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_UPDATE: ${{ github.event.inputs.update_post == 'true' && '1' || '0' }}
          BLOGGER_MODE: publish   # draft = مسودة، publish = نشر مباشر
        run: python scripts/blogger.py
      - name: حفظ التغييرات
        run: |
          if [ -z "$(git status --porcelain -- fuel.json fuel-news.txt posted.json)" ]; then
            echo "لا تغيير"; exit 0
          fi
          git config user.name "fuel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add fuel.json fuel-news.txt posted.json 2>/dev/null || git add fuel.json fuel-news.txt
          git commit -m "أسعار المحروقات $(date -u +%F)"
          git push
