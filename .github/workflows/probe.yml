name: probe-site
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -A "Mozilla/5.0" -o p.html "https://www.baalbakhermel.com/p/weather-page.html?m=1"
          curl -sSL -A "Mozilla/5.0" -o d.html "https://www.baalbakhermel.com/p/weather-page.html"
          for f in p.html d.html; do echo "== $f $(wc -c < $f)"; grep -c "__bhWeather" $f || true; grep -c "bh-auto-scripts" $f || true; grep -c 'id="bh-weather"\|id=.bh-weather' $f || true; grep -o "bh-weather[^<]\{0,40\}" $f | head -3; done
          python3 - <<'PY'
          import re
          h=open('p.html',encoding='utf-8',errors='replace').read()
          i=h.find('bh-auto-scripts'); print('MARK_CTX', repr(h[i-200:i+300]) if i>=0 else 'NONE')
          print('TAIL', repr(h[-600:]))
          PY
