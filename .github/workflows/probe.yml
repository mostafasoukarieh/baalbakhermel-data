name: probe-total
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -A "Mozilla/5.0" -o p.html -w "HTTP %{http_code} %{content_type} %{url_effective}\n" https://pricing.totalenergies.com.lb/fuelprice/ || true
          wc -c p.html
          python3 - <<'PY'
          import re
          h=open('p.html',encoding='utf-8',errors='replace').read()
          t=re.sub(r'<script[\s\S]*?</script>|<style[\s\S]*?</style>','',h)
          t=re.sub(r'<[^>]+>','|',t); t=re.sub(r'\s*\|[\s|]*',' | ',t)
          print("TEXT:", t[:3500])
          print("SCRIPTS:", re.findall(r'<script[^>]*src=["\']([^"\']+)',h)[:20])
          print("IFRAMES:", re.findall(r'<iframe[^>]*src=["\']([^"\']+)',h))
          print("APIS:", sorted(set(re.findall(r'["\'](/?(?:api|ajax|wp-json|graphql)[^"\']{0,80})["\']',h)))[:20])
          print("TABLES:", h.count('<table'))
          i=h.find('17/11') if '17/11' in h else h.find('Price in LBP')
          print("RAWDATE:", repr(h[i-400:i+300]))
          j=h.find('SP95'); print("RAW95:", repr(h[j-900:j+700]))
          print("JS:"); import urllib.request
          for f in ['demo2.js']:
              try: print(urllib.request.urlopen(urllib.request.Request('https://pricing.totalenergies.com.lb/fuelprice/'+f,headers={'User-Agent':'Mozilla/5.0'})).read().decode('utf-8','replace')[:1500])
              except Exception as e: print('ERR',e)
          PY
