<!-- التنسيق في آخر التدوينة حتى لا يظهر نص الـCSS في مقتطف البطاقة -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&amp;family=Tajawal:wght@400;500;700&amp;display=swap" rel="stylesheet" />
<style>
.gg-post{--dark:#06281C;--green:#0F8A4B;--green-l:#2FD27A;--line:rgba(255,255,255,.14);--sand:#F4F7F2;--gold:#F2C14E;direction:rtl;text-align:right;background:var(--dark);color:var(--sand);font-family:'Tajawal',sans-serif;line-height:1.9;border-radius:6px;overflow:hidden}
.gg-post *{box-sizing:border-box}
.gg-post .gg-cover{line-height:0}.gg-post .gg-cover a{display:block;margin:0!important}
.gg-post .gg-cover img{display:block;width:100%;height:auto;border:0;margin:0 auto}
.gg-post .gg-wrap{max-width:760px;margin:0 auto;padding:26px 18px 40px}
.gg-post .gg-kicker{display:inline-block;font-family:'Cairo',sans-serif;font-weight:700;font-size:13.5px;color:var(--dark);background:var(--gold);padding:2px 14px 4px;border-radius:3px;margin-bottom:14px}
.gg-post .gg-lede{font-size:18px;font-weight:500;color:#fff}
.gg-post p{font-size:16.5px;margin:0 0 14px;color:var(--sand)}
.gg-post h2{font-family:'Cairo',sans-serif;font-weight:800;font-size:21px;color:var(--green-l);margin:34px 0 12px;display:flex;align-items:center;gap:10px}
.gg-post .gg-dot{width:10px;height:10px;border-radius:50%;background:var(--gold);flex:none}
.gg-post h3{font-family:'Cairo',sans-serif;font-weight:700;font-size:17px;color:#fff;margin:20px 0 8px}
.gg-post ul,.gg-post ol{margin:0 0 16px;padding-inline-start:22px}
.gg-post li{margin-bottom:7px}.gg-post li::marker{color:var(--gold)}
.gg-post strong,.gg-post b{color:var(--gold)}
.gg-post a{color:var(--green-l)}
.gg-post .gg-pull{background:rgba(47,210,122,.10);border-inline-start:4px solid var(--gold);padding:14px 18px;margin:18px 0;font-family:'Cairo',sans-serif;font-weight:700;font-size:17px;color:#fff;border-radius:0 4px 4px 0}
.gg-post .gg-comp{border:1px solid var(--line);border-radius:6px;padding:4px 14px 10px;margin:0 0 14px;background:rgba(255,255,255,.03)}
.gg-post .gg-match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.gg-post .gg-match:last-child{border-bottom:0}
.gg-post .gg-team{font-weight:700;font-size:16px}.gg-post .gg-home{text-align:left}.gg-post .gg-away{text-align:right}
.gg-post .gg-score{min-width:74px;text-align:center;font-family:'Cairo',sans-serif;font-weight:800;font-size:18px;direction:rtl;padding:2px 10px;display:flex;justify-content:center;gap:6px;white-space:nowrap;border-radius:4px;background:rgba(255,255,255,.08)}
.gg-post .gg-score{flex-wrap:wrap}.gg-post .gg-score i{font-style:normal;opacity:.7}.gg-post .gg-score b{color:inherit}.gg-post .gg-score small{display:block;width:100%;font-size:11px;font-weight:600;direction:rtl}
.gg-post .gg-finished{background:var(--green);color:#fff}.gg-post .gg-live{background:#C0392B;color:#fff}
.gg-post .gg-up{color:var(--gold);font-size:16px}.gg-post .gg-off{font-size:13px;color:#ffb4a8;direction:rtl}
.gg-post .gg-extra{grid-column:1/-1;text-align:center;font-size:13px;opacity:.75;margin-top:-4px}
.gg-post .gg-src{font-size:13.5px;opacity:.8}
.gg-post .gg-closing{margin-top:30px;padding-top:22px;border-top:1px solid var(--line);text-align:center}
.gg-post .gg-closing p{font-size:14.5px}
.gg-post .gg-cta{display:inline-block;margin-bottom:14px;background:#25D366;color:#06281C!important;text-decoration:none;font-family:'Cairo',sans-serif;font-weight:800;font-size:15px;padding:10px 24px;border-radius:30px}
@media (max-width:520px){.gg-post .gg-team{font-size:14.5px}.gg-post .gg-score{min-width:60px;font-size:16px}}
</style>
