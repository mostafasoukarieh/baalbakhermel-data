<!doctype html><html dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:C;src:url(../../lapt/assets/fonts/cairo-arabic-900-normal.woff2);font-weight:900;unicode-range:U+0600-06FF,U+FE70-FEFF}
@font-face{font-family:C;src:url(../../lapt/assets/fonts/cairo-latin-900-normal.woff2);font-weight:900}
@font-face{font-family:C;src:url(../../lapt/assets/fonts/cairo-arabic-800-normal.woff2);font-weight:800;unicode-range:U+0600-06FF,U+FE70-FEFF}
@font-face{font-family:C;src:url(../../lapt/assets/fonts/cairo-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:T;src:url(../../lapt/assets/fonts/tajawal-arabic-700-normal.woff2);font-weight:700;unicode-range:U+0600-06FF,U+FE70-FEFF}
@font-face{font-family:T;src:url(../../lapt/assets/fonts/tajawal-latin-700-normal.woff2);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:T}
.c{position:relative;width:1200px;height:630px;overflow:hidden;color:#fff;
background:repeating-linear-gradient(90deg,#0C6B3A 0 100px,#0A5F33 100px 200px)}
.c::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 90% at 80% 20%,rgba(255,255,255,.10),transparent 60%),linear-gradient(0deg,rgba(4,30,18,.85),rgba(4,30,18,.35) 70%)}
.lines{position:absolute;inset:34px 34px 90px;border:4px solid rgba(255,255,255,.35);border-radius:4px}
.lines::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:4px solid rgba(255,255,255,.35)}
.lines::after{content:"";position:absolute;left:50%;top:50%;width:170px;height:170px;margin:-85px 0 0 -85px;border:4px solid rgba(255,255,255,.35);border-radius:50%}
.box{position:absolute;top:50%;width:120px;height:230px;margin-top:-115px;border:4px solid rgba(255,255,255,.35)}
.box.l{left:-4px;border-left:0}.box.r{right:-4px;border-right:0}
.ball{position:absolute;left:84px;top:96px;width:150px;height:150px;filter:drop-shadow(0 10px 22px rgba(0,0,0,.5))}
.txt{position:absolute;right:80px;top:78px;width:760px;text-align:right}
.kick{display:inline-block;font-family:C;font-weight:800;font-size:26px;color:#06281C;background:#F2C14E;padding:4px 22px 8px;border-radius:4px}
h1{font-family:C;font-weight:900;font-size:56px;line-height:1.3;margin:22px 0 14px;text-shadow:0 4px 18px rgba(0,0,0,.45)}
ul{list-style:none;display:flex;flex-direction:column;gap:10px;margin-top:6px}
li{font-family:T;font-weight:700;font-size:28px;display:flex;align-items:center;gap:14px;background:rgba(0,0,0,.35);padding:6px 18px;border-radius:6px;width:fit-content}
li::before{content:"";width:12px;height:12px;border-radius:50%;background:#2FD27A;flex:none}
.date{font-family:T;font-weight:700;font-size:26px;color:#BFF5D5}
.foot{position:absolute;left:0;right:0;bottom:0;height:70px;background:#06281C;border-top:4px solid #F2C14E;display:flex;align-items:center;justify-content:space-between;padding:0 70px;font-family:C;font-weight:800;font-size:24px}
.foot b{color:#2FD27A;direction:ltr;font-family:C}
</style></head><body><div class="c">
<div class="lines"><div class="box l"></div><div class="box r"></div></div>
<svg class="ball" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#fff"/>
<polygon points="50,30 66,42 60,61 40,61 34,42" fill="#06281C"/>
<g stroke="#06281C" stroke-width="3" fill="none"><path d="M50 30V8M66 42l20-8M60 61l12 18M40 61l-12 18M34 42l-20-8"/></g>
<g fill="#06281C"><path d="M42 3a48 48 0 0 1 16 0l-8 6z"/><path d="M97 44a48 48 0 0 1-3 17l-8-11z"/><path d="M80 88a48 48 0 0 1-14 9l1-12z"/><path d="M34 97a48 48 0 0 1-14-9l13-3z"/><path d="M6 61a48 48 0 0 1-3-17l11 6z"/></g></svg>
<div class="txt">
 <span class="kick">{{KICKER}}</span>
 <h1>{{TITLE}}</h1>
 <ul>{{ITEMS}}</ul>
 <div class="date">{{DATE}}</div>
</div>
<div class="foot"><span>Green Goal Arena · الأخبار الرياضية</span><b>greengoal.net</b></div>
</div></body></html>
